<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT Math 1000 & TI-84 Evo Master Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }

    .lcd-screen {
      font-family: 'Fira Code', monospace;
      background: linear-gradient(135deg, #121c17 0%, #0d1612 100%);
      color: #3bf6a8;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 15px rgba(59,246,168,0.1);
      border: 2px solid #224433;
      text-shadow: 0 0 2px rgba(59,246,168,0.6);
    }

    .key-badge {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      box-shadow: 0 2px 0 #0f172a, inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 shrink-0 px-4 py-3 sm:px-6 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-cyan-600 to-emerald-500 text-white p-2 rounded-xl shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-calculator text-xl sm:text-2xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
          SAT Math 1,000 <span class="text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-400 font-mono border border-cyan-500/30">TI-84 Evo Edition</span>
        </h1>
        <p class="text-xs text-slate-400 hidden sm:block">Step-by-step calculator shortcuts & simulated screen outputs</p>
      </div>
    </div>

    <!-- Quick Stats / Controls -->
    <div class="flex items-center space-x-3 text-sm">
      <button id="quiz-toggle-btn" onclick="toggleQuizMode()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition flex items-center gap-2">
        <i class="fa-solid fa-eye-slash text-cyan-400" id="quiz-icon"></i>
        <span id="quiz-btn-text" class="hidden sm:inline">Quiz Mode: OFF</span>
      </button>

      <button id="favorites-toggle-btn" onclick="toggleFavoritesFilter()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition flex items-center gap-2">
        <i class="fa-solid fa-bookmark text-amber-400"></i>
        <span>Saved (<span id="fav-count">0</span>)</span>
      </button>
    </div>
  </header>

  <!-- Main Toolbar & Filters -->
  <div class="bg-slate-900/60 border-b border-slate-800/80 p-3 sm:p-4 shrink-0 backdrop-blur">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-3 items-stretch lg:items-center justify-between">
      
      <!-- Search Input -->
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search 1,000 problems by keyword, equation, domain, or calculator trick..." 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
          oninput="handleFilterChange()"
        />
      </div>

      <!-- Filters & Jump to # -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs sm:text-sm">
        
        <!-- Domain Select -->
        <select id="domain-select" onchange="handleFilterChange()" class="bg-slate-950 border border-slate-800 text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
          <option value="ALL">All Domains (4)</option>
          <option value="Algebra">Algebra</option>
          <option value="Advanced Math">Advanced Math</option>
          <option value="Problem Solving & Data Analysis">Data Analysis</option>
          <option value="Geometry & Trigonometry">Geometry & Trig</option>
        </select>

        <!-- TI-84 Feature Select -->
        <select id="feature-select" onchange="handleFilterChange()" class="bg-slate-950 border border-slate-800 text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
          <option value="ALL">All TI-84 Features</option>
          <option value="[Y=] Graph Intersect">[Y=] Graph Intersect</option>
          <option value="Table Trick [2nd][GRAPH]">Table Match [2nd][GRAPH]</option>
          <option value="PolySmlt2 / Poly Root">PolySmlt2 / Root Finder</option>
          <option value="System Solver [APPS]">System Solver [APPS]</option>
          <option value="1-Var Stats [STAT]">1-Var Stats [STAT]</option>
          <option value="LinReg (ax+b) [STAT]">LinReg (ax+b) [STAT]</option>
          <option value="Solver App [MATH]">Solver App [MATH]</option>
          <option value="Fraction Toggle [MATH][1]">Fraction Toggle [MATH][1]</option>
        </select>

        <!-- Jump to Problem # -->
        <div class="flex items-center gap-1 bg-slate-950 border border-slate-800 rounded-xl px-2 py-1">
          <span class="text-xs text-slate-500 pl-1">#</span>
          <input 
            type="number" 
            id="jump-input" 
            placeholder="1-1000" 
            min="1" 
            max="1000" 
            class="w-16 bg-transparent text-slate-200 text-xs sm:text-sm focus:outline-none py-1"
            onkeypress="if(event.key==='Enter') jumpToProblem()"
          />
          <button onclick="jumpToProblem()" class="px-2 py-1 bg-cyan-600/30 hover:bg-cyan-600/50 text-cyan-300 rounded-lg text-xs font-medium transition">
            Go
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Content Container (Scrollable) -->
  <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-950">
    <div class="max-w-7xl mx-auto space-y-6">
      
      <!-- Results Status Bar -->
      <div class="flex items-center justify-between text-xs sm:text-sm text-slate-400 border-b border-slate-800/60 pb-3">
        <div>
          Showing <span id="showing-count" class="font-semibold text-slate-200">0</span> of <span id="total-matching-count" class="font-semibold text-slate-200">1,000</span> matched problems
        </div>
        <div id="page-indicator" class="font-mono text-cyan-400">
          Page 1
        </div>
      </div>

      <!-- Problem Cards List -->
      <div id="problem-list" class="space-y-6">
        <!-- Rendered dynamically -->
      </div>

      <!-- Pagination / Load More Controls -->
      <div id="pagination-container" class="pt-6 pb-12 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-800">
        <button id="prev-btn" onclick="changePage(-1)" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-left text-xs"></i> Previous Page
        </button>

        <div id="page-buttons" class="flex items-center gap-1.5 flex-wrap justify-center">
          <!-- Page numbers injected here -->
        </div>

        <button id="next-btn" onclick="changePage(1)" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center justify-center gap-2">
          Next Page <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>

    </div>
  </main>

  <!-- JavaScript Logic -->
  <script>
    // Global App State
    let quizMode = false;
    let favoritesOnly = false;
    let favorites = new Set(JSON.parse(localStorage.getItem('sat_math_favs') || '[]'));
    let selectedAnswers = {}; // user selected answers in quiz mode

    let currentPage = 1;
    const pageSize = 20;
    let filteredIndices = []; // Stores matching problem indices (0 - 999)

    // Domain and Feature definitions for generator
    const DOMAINS = [
      "Algebra",
      "Advanced Math",
      "Problem Solving & Data Analysis",
      "Geometry & Trigonometry"
    ];

    const FEATURES = [
      "[Y=] Graph Intersect",
      "Table Trick [2nd][GRAPH]",
      "PolySmlt2 / Poly Root",
      "System Solver [APPS]",
      "1-Var Stats [STAT]",
      "LinReg (ax+b) [STAT]",
      "Solver App [MATH]",
      "Fraction Toggle [MATH][1]"
    ];

    // Seeded Pseudo-Random Generator for fast deterministic problem generation
    function pseudoRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    // Generator function that builds problem item #i on the fly without heavy memory overhead
    function getProblem(id) {
      const seed = id * 1337 + 42;
      const r = (offset = 0) => pseudoRandom(seed + offset);

      const domainIndex = Math.floor(r(1) * DOMAINS.length);
      const domain = DOMAINS[domainIndex];
      const featureIndex = Math.floor(r(2) * FEATURES.length);
      const feature = FEATURES[featureIndex];

      let statement = "";
      let options = [];
      let correctIdx = Math.floor(r(3) * 4);
      let keypressSteps = [];
      let lcdOutput = "";
      let explanation = "";

      // Generator logic tailored per feature & domain
      switch (feature) {
        case "[Y=] Graph Intersect": {
          const a = Math.floor(r(4) * 8) + 2;
          const b = Math.floor(r(5) * 15) + 1;
          const target = a * 3 + b;
          statement = `If $f(x) = ${a}x + ${b}$ and $g(x) = 2x + ${b + 3}$, what is the x-coordinate of the intersection point of the two lines?`;
          
          const correctVal = 3;
          options = [
            `x = ${correctVal - 2}`,
            `x = ${correctVal}`,
            `x = ${correctVal + 1}`,
            `x = ${correctVal + 4}`
          ];
          
          keypressSteps = [
            `Press [Y=] and enter Y1 = ${a}X + ${b}`,
            `Enter Y2 = 2X + ${b + 3}`,
            `Press [2nd] [TRACE] (CALC) -> Select [5: intersect]`,
            `Press [ENTER] for First curve, [ENTER] for Second curve, [ENTER] for Guess`
          ];

          lcdOutput = `Intersection\nX=3         Y=${a*3+b}`;
          explanation = `By graphing both equations in Y1 and Y2 and using [2nd][TRACE] -> intersect, the calculator finds the exact intersection point at x = ${correctVal}.`;
          break;
        }

        case "Table Trick [2nd][GRAPH]": {
          const m = Math.floor(r(4) * 5) + 2;
          const k = Math.floor(r(5) * 10) + 2;
          statement = `Which of the following functions generates the coordinates $(1, ${m + k})$, $(2, ${2*m + k})$, and $(3, ${3*m + k})$?`;
          
          options = [
            `f(x) = ${m}x + ${k}`,
            `f(x) = ${m + 1}x + ${k - 1}`,
            `f(x) = ${m}x^2 + ${k}`,
            `f(x) = ${2*m}x + ${k}`
          ];

          keypressSteps = [
            `Press [Y=] and enter choice A: Y1 = ${m}X + ${k}`,
            `Press [2nd] [WINDOW] (TBLSET) -> Set TblStart = 1, ΔTbl = 1`,
            `Press [2nd] [GRAPH] (TABLE) to view outputs`,
            `Verify that X=1 gives ${m+k}, X=2 gives ${2*m+k}, and X=3 gives ${3*m+k}`
          ];

          lcdOutput = `X  | Y1\n1  | ${m+k}\n2  | ${2*m+k}\n3  | ${3*m+k}`;
          explanation = `Using the Table feature [2nd][GRAPH], we can quickly inspect table values for each function option to match the given table data.`;
          break;
        }

        case "PolySmlt2 / Poly Root": {
          const r1 = Math.floor(r(4) * 6) + 1;
          const r2 = Math.floor(r(5) * 6) + 1;
          const B = -(r1 + r2);
          const C = r1 * r2;
          statement = `What are the real roots of the quadratic equation $x^2 ${B >= 0 ? '+ ' + B : B}x ${C >= 0 ? '+ ' + C : C} = 0$?`;

          options = [
            `x = ${r1} and x = ${r2}`,
            `x = -${r1} and x = ${r2 + 1}`,
            `x = ${r1 + 2} and x = -${r2}`,
            `x = -${r1} and x = -${r2}`
          ];

          keypressSteps = [
            `Press [APPS] -> Select [PlySmlt2]`,
            `Select [1: Polynomial Root Finder]`,
            `Set Degree = 2, Real numbers`,
            `Enter coefficients: a2 = 1, a1 = ${B}, a0 = ${C}`,
            `Press [SOLVE] (f5 key)`
          ];

          lcdOutput = `POLY ROOT FINDER\nx1=${r1}\nx2=${r2}`;
          explanation = `PolySmlt2 instantly solves high-degree polynomials without needing the quadratic formula manually.`;
          break;
        }

        case "System Solver [APPS]": {
          const xVal = Math.floor(r(4) * 5) + 1;
          const yVal = Math.floor(r(5) * 5) + 2;
          const eq1_c = xVal + yVal;
          const eq2_c = 2 * xVal - yVal;

          statement = `Solve the system of equations for $(x, y)$:\n1) $x + y = ${eq1_c}$\n2) $2x - y = ${eq2_c}$`;

          options = [
            `(${xVal}, ${yVal})`,
            `(${xVal + 1}, ${yVal - 1})`,
            `(${xVal - 1}, ${yVal + 2})`,
            `(${yVal}, ${xVal})`
          ];

          keypressSteps = [
            `Press [APPS] -> Select [PlySmlt2]`,
            `Select [2: System of Linear Eqn Solver]`,
            `Set Equations = 2, Unknowns = 2`,
            `Enter Matrix [1  1 | ${eq1_c}] and [2 -1 | ${eq2_c}]`,
            `Press [SOLVE]`
          ];

          lcdOutput = `SYSTEM SOLVER\nx1 = ${xVal}\nx2 = ${yVal}`;
          explanation = `The Simultaneous Equation Solver application handles 2x2 and 3x3 systems of linear equations in seconds.`;
          break;
        }

        case "1-Var Stats [STAT]": {
          const base = Math.floor(r(4) * 20) + 70;
          const data = [base, base + 2, base + 5, base + 5, base + 8, base + 10];
          const sum = data.reduce((a, b) => a + b, 0);
          const mean = (sum / data.length).toFixed(2);

          statement = `Find the mean of the data set: $\{${data.join(', ')}\}$.`;

          options = [
            `x̄ = ${mean}`,
            `x̄ = ${(parseFloat(mean) + 1.2).toFixed(2)}`,
            `x̄ = ${(parseFloat(mean) - 0.8).toFixed(2)}`,
            `x̄ = ${(parseFloat(mean) + 2.5).toFixed(2)}`
          ];

          keypressSteps = [
            `Press [STAT] -> [1: Edit...]`,
            `Clear List L1 and enter items: ${data.join(', ')}`,
            `Press [STAT] -> Arrow right to [CALC] -> Select [1: 1-Var Stats]`,
            `Set List: L1 -> Press [Calculate]`
          ];

          lcdOutput = `1-Var Stats\nx̄=${mean}\nΣx=${sum}\nn=${data.length}\nMed=${data[2]}`;
          explanation = `1-Var Stats automatically computes mean (x̄), median, quartiles, and standard deviation for any list.`;
          break;
        }

        case "LinReg (ax+b) [STAT]": {
          statement = `A scatterplot shows data with points (1, 4), (2, 7), (3, 10), (4, 13). What is the linear regression slope (a)?`;

          options = [
            `a = 3.00`,
            `a = 2.50`,
            `a = 4.00`,
            `a = 1.00`
          ];

          keypressSteps = [
            `Press [STAT] -> [1: Edit...]`,
            `Enter X values {1, 2, 3, 4} into L1`,
            `Enter Y values {4, 7, 10, 13} into L2`,
            `Press [STAT] -> [CALC] -> [4: LinReg(ax+b)]`,
            `Press [Calculate]`
          ];

          lcdOutput = `LinReg\ny=ax+b\na=3\nb=1\nr²=1`;
          explanation = `LinReg calculates the best-fit line equation y = ax + b and correlation coefficients.`;
          break;
        }

        case "Solver App [MATH]": {
          const c = Math.floor(r(4) * 30) + 10;
          statement = `Solve for positive $x$ in the equation $3^{x} = ${Math.pow(3, 4)}$`;

          options = [
            `x = 4`,
            `x = 3`,
            `x = 5`,
            `x = 12`
          ];

          keypressSteps = [
            `Press [MATH] -> Arrow down to [B: Solver...] or [Numeric Solver]`,
            `Enter Eqn1: E1 = 3^X`,
            `Enter Eqn2: E2 = 81`,
            `Press [OK] / [SOLVE] (f5 key)`
          ];

          lcdOutput = `NUMERIC SOLVER\n3^X - 81 = 0\n X=4\n bound={-1E99,1E9...}`;
          explanation = `The TI-84 Numeric Solver uses iterative algorithms to solve any complex single-variable equation.`;
          break;
        }

        default: { // Fraction Toggle
          const num = 14;
          const den = 35;
          statement = `Express the decimal $0.4$ as a simplified fraction.`;

          options = [
            `2/5`,
            `4/10`,
            `1/3`,
            `3/8`
          ];

          keypressSteps = [
            `Type [0] [.] [4] on the home screen`,
            `Press [MATH]`,
            `Select [1: Frac]`,
            `Press [ENTER]`
          ];

          lcdOutput = `0.4►Frac\n             2/5`;
          explanation = `The ►Frac function instantly converts repeating or terminating decimals into simplified fractional form.`;
          break;
        }
      }

      // Shuffle options to place correct answer at correctIdx
      const originalOptions = [...options];
      const correctText = originalOptions[0]; // original[0] was built as correct
      options = ["", "", "", ""];
      options[correctIdx] = correctText;

      let remainingIdx = 0;
      for (let i = 0; i < 4; i++) {
        if (i !== correctIdx) {
          remainingIdx++;
          options[i] = originalOptions[remainingIdx] || `Option ${i+1}`;
        }
      }

      return {
        id: id + 1,
        domain: domain,
        feature: feature,
        statement: statement,
        options: options,
        correctIdx: correctIdx,
        keypressSteps: keypressSteps,
        lcdOutput: lcdOutput,
        explanation: explanation
      };
    }

    // Initialize Filtered Indices
    function applyFilters() {
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      const domainVal = document.getElementById('domain-select').value;
      const featureVal = document.getElementById('feature-select').value;

      filteredIndices = [];

      for (let i = 0; i < 1000; i++) {
        const p = getProblem(i);

        if (favoritesOnly && !favorites.has(p.id)) continue;
        if (domainVal !== 'ALL' && p.domain !== domainVal) continue;
        if (featureVal !== 'ALL' && p.feature !== featureVal) continue;

        if (searchVal) {
          const matchText = `${p.id} ${p.statement} ${p.domain} ${p.feature} ${p.explanation}`.toLowerCase();
          if (!matchText.includes(searchVal)) continue;
        }

        filteredIndices.push(i);
      }

      currentPage = 1;
      renderList();
    }

    function renderList() {
      const problemListEl = document.getElementById('problem-list');
      const totalCount = filteredIndices.length;

      document.getElementById('total-matching-count').innerText = totalCount.toLocaleString();

      if (totalCount === 0) {
        problemListEl.innerHTML = `
          <div class="text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800">
            <i class="fa-solid fa-filter-circle-xmark text-4xl text-slate-600 mb-3"></i>
            <h3 class="text-lg font-medium text-slate-300">No matching SAT Math problems found</h3>
            <p class="text-xs text-slate-500 mt-1">Try resetting your search criteria or category filters.</p>
          </div>
        `;
        document.getElementById('showing-count').innerText = "0";
        document.getElementById('page-indicator').innerText = "Page 0";
        renderPagination(0);
        return;
      }

      const totalPages = Math.ceil(totalCount / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = Math.min(startIndex + pageSize, totalCount);

      document.getElementById('showing-count').innerText = `${startIndex + 1} - ${endIndex}`;
      document.getElementById('page-indicator').innerText = `Page ${currentPage} of ${totalPages}`;

      let html = '';

      for (let i = startIndex; i < endIndex; i++) {
        const pIndex = filteredIndices[i];
        const p = getProblem(pIndex);
        const isFav = favorites.has(p.id);
        const userChoice = selectedAnswers[p.id];

        html += `
          <div class="bg-slate-900 border border-slate-800/90 rounded-2xl p-5 sm:p-6 shadow-xl relative transition-all duration-200 hover:border-slate-700/80">
            
            <!-- Card Top Header -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-800/70">
              <div class="flex items-center gap-2">
                <span class="text-xs font-mono font-bold px-2.5 py-1 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                  Problem #${p.id}
                </span>
                <span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">
                  ${p.domain}
                </span>
                <span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
                  <i class="fa-solid fa-microchip text-[10px]"></i> ${p.feature}
                </span>
              </div>

              <!-- Bookmark Button -->
              <button onclick="toggleBookmark(${p.id})" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-amber-400 transition">
                <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-bookmark"></i>
              </button>
            </div>

            <!-- Problem Statement -->
            <div class="mb-5 text-slate-200 text-sm sm:text-base leading-relaxed font-normal">
              ${p.statement.replace(/\n/g, '<br/>')}
            </div>

            <!-- Options Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
              ${p.options.map((opt, idx) => {
                const optLetter = String.fromCharCode(65 + idx);
                const isCorrect = idx === p.correctIdx;
                let btnStyle = "bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700";

                if (!quizMode) {
                  // Standard Mode - Highlight Correct
                  if (isCorrect) {
                    btnStyle = "bg-emerald-950/40 border-emerald-500/60 text-emerald-300 font-medium";
                  }
                } else {
                  // Quiz Mode Logic
                  if (userChoice !== undefined) {
                    if (idx === userChoice) {
                      btnStyle = isCorrect 
                        ? "bg-emerald-950/60 border-emerald-500 text-emerald-300" 
                        : "bg-rose-950/60 border-rose-500 text-rose-300";
                    } else if (isCorrect) {
                      btnStyle = "bg-emerald-950/30 border-emerald-500/40 text-emerald-400";
                    }
                  }
                }

                return `
                  <button 
                    onclick="selectOption(${p.id}, ${idx})"
                    class="p-3 rounded-xl border text-left transition flex items-start gap-3 text-xs sm:text-sm ${btnStyle}">
                    <span class="w-6 h-6 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-slate-400 text-xs shrink-0">
                      ${optLetter}
                    </span>
                    <span class="pt-0.5">${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- TI-84 Evo Step-by-Step & LCD Display Container -->
            <div class="mt-4 ${quizMode && userChoice === undefined ? 'hidden' : 'block'} border-t border-slate-800/80 pt-5">
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                
                <!-- Steps List -->
                <div class="lg:col-span-7 space-y-2.5">
                  <h4 class="text-xs font-semibold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> TI-84 Evo Keypress Workflow
                  </h4>
                  <ol class="space-y-1.5 text-xs text-slate-300">
                    ${p.keypressSteps.map((step, sIdx) => `
                      <li class="flex items-start gap-2 bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
                        <span class="font-mono text-cyan-400 font-bold">${sIdx + 1}.</span>
                        <span>${step}</span>
                      </li>
                    `).join('')}
                  </ol>
                  <p class="text-xs text-slate-400 mt-2 italic bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/40">
                    <strong class="text-slate-300 font-semibold">SAT Strategy Tip:</strong> ${p.explanation}
                  </p>
                </div>

                <!-- Simulated LCD Screen -->
                <div class="lg:col-span-5">
                  <h4 class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-tv"></i> Simulated TI-84 LCD Display
                  </h4>
                  <div class="lcd-screen rounded-xl p-4 text-xs leading-relaxed whitespace-pre font-mono">
                    <div class="flex justify-between items-center text-[10px] text-emerald-500/70 border-b border-emerald-900/60 pb-1 mb-2">
                      <span>NORMAL FLOAT AUTO REAL</span>
                      <span>TI-84 EVO</span>
                    </div>
                    <div>${p.lcdOutput}</div>
                  </div>
                </div>

              </div>
            </div>

          </div>
        `;
      }

      problemListEl.innerHTML = html;
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const buttonsContainer = document.getElementById('page-buttons');

      prevBtn.disabled = currentPage === 1 || totalPages === 0;
      nextBtn.disabled = currentPage === totalPages || totalPages === 0;

      if (totalPages === 0) {
        buttonsContainer.innerHTML = '';
        return;
      }

      let pagesHtml = '';
      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);

      if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }

      for (let p = startPage; p <= endPage; p++) {
        const isActive = p === currentPage;
        pagesHtml += `
          <button 
            onclick="goToPage(${p})" 
            class="w-8 h-8 rounded-lg text-xs font-semibold transition ${
              isActive 
                ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/30' 
                : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white border border-slate-800'
            }">
            ${p}
          </button>
        `;
      }

      buttonsContainer.innerHTML = pagesHtml;
    }

    function goToPage(p) {
      currentPage = p;
      renderList();
      document.getElementById('scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changePage(delta) {
      currentPage += delta;
      renderList();
      document.getElementById('scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleFilterChange() {
      applyFilters();
    }

    function jumpToProblem() {
      const input = document.getElementById('jump-input');
      const num = parseInt(input.value);
      if (isNaN(num) || num < 1 || num > 1000) return;

      // Reset filters so problem is visible
      document.getElementById('search-input').value = '';
      document.getElementById('domain-select').value = 'ALL';
      document.getElementById('feature-select').value = 'ALL';
      favoritesOnly = false;
      document.getElementById('favorites-toggle-btn').classList.remove('bg-amber-500/20', 'border-amber-500/40');

      applyFilters();

      // Find index in filtered
      const targetIdx = filteredIndices.indexOf(num - 1);
      if (targetIdx !== -1) {
        currentPage = Math.floor(targetIdx / pageSize) + 1;
        renderList();
        document.getElementById('scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function toggleQuizMode() {
      quizMode = !quizMode;
      const btnText = document.getElementById('quiz-btn-text');
      const icon = document.getElementById('quiz-icon');
      
      if (quizMode) {
        btnText.innerText = 'Quiz Mode: ON';
        icon.className = 'fa-solid fa-eye text-emerald-400';
      } else {
        btnText.innerText = 'Quiz Mode: OFF';
        icon.className = 'fa-solid fa-eye-slash text-cyan-400';
      }

      renderList();
    }

    function toggleFavoritesFilter() {
      favoritesOnly = !favoritesOnly;
      const btn = document.getElementById('favorites-toggle-btn');
      if (favoritesOnly) {
        btn.classList.add('bg-amber-500/20', 'border-amber-500/40');
      } else {
        btn.classList.remove('bg-amber-500/20', 'border-amber-500/40');
      }
      applyFilters();
    }

    function toggleBookmark(problemId) {
      if (favorites.has(problemId)) {
        favorites.delete(problemId);
      } else {
        favorites.add(problemId);
      }
      localStorage.setItem('sat_math_favs', JSON.stringify([...favorites]));
      document.getElementById('fav-count').innerText = favorites.size;
      renderList();
    }

    function selectOption(problemId, optionIdx) {
      selectedAnswers[problemId] = optionIdx;
      renderList();
    }

    // Initialize App on DOM ready
    window.onload = function() {
      document.getElementById('fav-count').innerText = favorites.size;
      applyFilters();
    };
  </script>
</body>
</html>
